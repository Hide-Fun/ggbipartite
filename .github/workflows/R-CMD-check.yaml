name: R CMD check

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
  R_KEEP_PKG_SOURCE: yes

jobs:
  build-source:
    name: Build source package
    runs-on: ubuntu-latest
    env:
      R_BIOC_VERSION: "3.23"
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.0"
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::BiocManager
            any::rcmdcheck
          needs: check

      - name: Build one source tarball for the check matrix
        shell: bash
        run: |
          mkdir -p source-package
          R CMD build . --no-manual --compact-vignettes=gs+qpdf
          mv ggbipartite_*.tar.gz source-package/

      - name: Upload source tarball
        uses: actions/upload-artifact@v4
        with:
          name: source-package
          path: source-package/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  check:
    name: ${{ matrix.config.id }}
    needs: build-source
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - id: release-linux
            os: ubuntu-latest
            r: "4.6.0"
            bioc: "3.23"
          - id: release-windows
            os: windows-latest
            r: "4.6.0"
            bioc: "3.23"
          - id: release-macos
            os: macos-latest
            r: "4.6.0"
            bioc: "3.23"
          - id: oldrel-linux
            os: ubuntu-latest
            r: oldrel-1
            bioc: "3.22"
          - id: floor-linux
            os: ubuntu-latest
            r: "4.1.3"
            bioc: "3.14"
          - id: bioc-devel-linux
            os: ubuntu-latest
            r: "4.6.0"
            bioc: "3.24"
    env:
      R_BIOC_VERSION: ${{ matrix.config.bioc }}
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::BiocManager
            any::rcmdcheck
          needs: check

      - name: Verify the Bioconductor repository line
        shell: Rscript {0}
        run: |
          expected <- Sys.getenv("R_BIOC_VERSION")
          actual <- as.character(BiocManager::version())
          stopifnot(identical(actual, expected))

      - name: Download source tarball
        uses: actions/download-artifact@v4
        with:
          name: source-package
          path: source-package

      - name: Check the shared source tarball
        shell: Rscript {0}
        run: |
          tarballs <- list.files(
            "source-package",
            pattern = "[.]tar[.]gz$",
            full.names = TRUE
          )
          stopifnot(length(tarballs) == 1L)
          rcmdcheck::rcmdcheck(
            path = tarballs[[1]],
            args = c("--no-manual", "--as-cran"),
            build_args = character(),
            check_dir = "check",
            error_on = "warning"
          )

      - name: Show testthat output
        if: always()
        shell: bash
        run: |
          find check -name 'testthat.Rout*' -exec cat '{}' \; || true

      - name: Upload check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.id }}-results
          path: check
          if-no-files-found: ignore
          retention-days: 7
